<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scene loop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/player.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="mark"></span>
        <strong>Scene loop</strong>
      </div>
      <select id="projectSel" class="project-sel" title="Project"></select>
      <button class="btn" id="newProject" title="Create a project from the template" hidden>+ New project</button>
      <span class="muted small" id="meta"></span>
      <div class="spacer"></div>
      <span class="muted small" id="renderState"></span>
      <details class="renders">
        <summary class="btn">Renders</summary>
        <div id="renderList" class="menu"></div>
      </details>
      <button class="btn dark" id="renderBtn">Render mp4</button>
    </header>

    <main class="main">
      <section class="left">
        <div class="empty-projects" id="empty" hidden></div>
        <div class="scene-label"><span id="sceneLabel"></span> <span class="muted" id="title"></span></div>
        <div class="stage-wrap">
          <div class="stage" id="stage">
            <scene-player id="player"></scene-player>
            <div class="overlay" id="overlay"></div>
            <div class="shade" id="shade"><span>Loading…</span></div>
          </div>
        </div>

        <div class="transport">
          <div class="seg dark" id="modeSeg">
            <button data-mode="scene" class="on">This scene</button>
            <button data-mode="whole">Whole video</button>
          </div>
          <button class="icon" id="playBtn" title="Play / pause (space)">▶</button>
          <span class="time" id="time">0.00 / 0.00</span>
          <div class="track-wrap">
            <div class="track" id="track"><div class="head" id="head"></div></div>
            <div class="ticks" id="ticks"></div>
          </div>
          <button class="btn dark" id="commentBtn" title="Pin a comment on this frame (C)">Comment</button>
        </div>
        <p class="narration" id="narration"></p>

        <section class="versions-sec" id="versionsSec" hidden>
          <div class="versions-head">
            <h3 id="versionsTitle">Versions</h3>
            <span class="muted" id="viewing"></span>
            <div class="spacer"></div>
            <button class="btn ghost" id="flipBtn" title="Flip the player between the two compared versions at the same time (F)" hidden>Flip A/B</button>
            <button class="btn ghost" id="closeCompare" hidden>Close compare</button>
          </div>
          <div class="compare" id="compare" hidden></div>
          <div class="versions" id="versions"></div>
        </section>
      </section>

      <aside class="panel">
        <div class="panel-head">
          <div class="panel-title" id="panelTitle"></div>
          <div class="spacer"></div>
          <div class="muted small" id="panelSub"></div>
        </div>
        <div class="toolbar">
          <button class="btn" id="versionsBtn" title="Show the scene's versions under the player">Versions</button>
          <div class="spacer"></div>
          <button class="btn ghost" id="copyPrompt" title="Copy a prompt for the chat next to this page" hidden>Copy prompt</button>
        </div>
        <div class="chat" id="chat"></div>
        <div class="pending" id="pending"></div>
        <div class="composer" id="composer">
          <textarea id="note" rows="3" placeholder='What should change? e.g. "Hold on the headline a full second longer, then slide the card in from the right."'></textarea>
          <div class="composer-row">
            <span class="muted small" id="handoff">⌘↵ to add</span>
            <div class="spacer"></div>
            <button class="btn dark" id="addNote">Add comment</button>
          </div>
        </div>
      </aside>
    </main>

    <nav class="filmstrip" id="filmstrip"></nav>

    <div class="pop" id="pop" hidden>
      <textarea id="popText" rows="3" placeholder="What should change here?"></textarea>
      <div class="composer-row">
        <span class="muted small" id="popWhere"></span>
        <div class="spacer"></div>
        <button class="btn ghost" id="popCancel">Cancel</button>
        <button class="btn accent" id="popSave">Add</button>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
